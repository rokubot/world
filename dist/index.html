<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Roku World</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #090d16;
        color: #f0f3f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        color: #c9a84c;
        z-index: 1000;
        transition: opacity 0.5s ease;
      }
      .loader-spinner {
        width: 52px;
        height: 52px;
        border: 4px solid rgba(201, 168, 76, 0.2);
        border-top-color: #c9a84c;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #top-hud {
        position: fixed;
        top: 16px;
        left: 16px;
        background: rgba(13, 17, 23, 0.9);
        border: 1px solid rgba(201, 168, 76, 0.4);
        border-radius: 10px;
        padding: 14px 18px;
        color: #f0f3f6;
        z-index: 50;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        max-width: 380px;
      }
      #top-hud h1 {
        font-size: 17px;
        font-weight: 700;
        color: #c9a84c;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #top-hud p {
        font-size: 13px;
        color: #8b949e;
        line-height: 1.4;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(46, 160, 67, 0.2);
        color: #3fb950;
        border: 1px solid rgba(46, 160, 67, 0.4);
      }
      .prof-selector {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .prof-label {
        font-size: 11px;
        text-transform: uppercase;
        color: #c9a84c;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .prof-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .prof-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ddd;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .prof-btn:hover {
        border-color: #c9a84c;
        color: #fff;
      }
      .prof-btn.active {
        background: rgba(201, 168, 76, 0.25);
        border-color: #c9a84c;
        color: #c9a84c;
        font-weight: 700;
      }
      #test-nav {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(13, 17, 23, 0.9);
        border: 1px solid rgba(201, 168, 76, 0.4);
        border-radius: 10px;
        padding: 14px 18px;
        z-index: 50;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #test-nav h2 {
        font-size: 13px;
        font-weight: 700;
        color: #c9a84c;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .test-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 280px;
      }
      .test-btn {
        background: rgba(201, 168, 76, 0.15);
        color: #e6edf3;
        border: 1px solid rgba(201, 168, 76, 0.4);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .test-btn:hover {
        background: #c9a84c;
        color: #090d16;
        transform: translateY(-1px);
      }
      .test-btn.highlight {
        background: #c9a84c;
        color: #0d1117;
        font-weight: 700;
      }
      #controls-hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(13, 17, 23, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        color: #8b949e;
        z-index: 50;
        backdrop-filter: blur(6px);
      }
      #controls-hint span {
        color: #c9a84c;
        font-weight: 600;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BiaBwbhg.js"></script>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="loader-spinner"></div>
      <h2>Generating Roku World...</h2>
      <p id="loading-status" style="margin-top: 8px; color: #8b949e; font-size: 13px;">Extruding continents from GeoJSON...</p>
    </div>

    <div id="top-hud">
      <h1>🌍 Roku World <span class="status-pill">Step 1, 2 &amp; 3 Active</span></h1>
      <p>Earth geometry &bull; Coordinate validation &bull; Player avatar</p>
      
      <div class="prof-selector">
        <div class="prof-label">Step 3 Profession Switcher</div>
        <div class="prof-buttons">
          <button class="prof-btn active" data-prof="wayfarer">Wayfarer</button>
          <button class="prof-btn" data-prof="artificer">Artificer</button>
          <button class="prof-btn" data-prof="mystic">Mystic</button>
          <button class="prof-btn" data-prof="tycoon">Tycoon</button>
        </div>
      </div>

      <div id="hud-stats" style="margin-top: 10px; font-size: 12px; color: #7ee787;">Loading countries...</div>
    </div>

    <div id="test-nav">
      <h2>Camera &amp; Locations</h2>
      <div class="test-btns">
        <button class="test-btn highlight" id="btn-focus-player">Focus Player 👤</button>
        <button class="test-btn" id="btn-toggle-boxes">Hide Test Boxes 🟥</button>
        <button class="test-btn" data-loc="Overview">Full Map</button>
        <button class="test-btn" data-loc="Dubai">Dubai 🇦🇪</button>
        <button class="test-btn" data-loc="Paris">Paris 🇫🇷</button>
        <button class="test-btn" data-loc="Sydney">Sydney 🇦🇺</button>
        <button class="test-btn" data-loc="New York">New York 🇺🇸</button>
        <button class="test-btn" data-loc="Tokyo">Tokyo 🇯🇵</button>
      </div>
    </div>

    <div id="controls-hint">
      <span>Left Click + Drag</span> Rotate &bull; <span>Right Click + Drag</span> Pan &bull; <span>Scroll</span> Zoom
    </div>

    <canvas id="game-canvas"></canvas>
  </body>
</html>
